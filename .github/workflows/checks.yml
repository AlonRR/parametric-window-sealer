# .github/workflows/checks.yml
#
# Lives in .github/workflows on purpose. Gitea searches `.gitea/workflows` FIRST and, if that
# directory exists at all, ignores `.github/workflows` entirely; GitHub never reads `.gitea/`.
# One file in `.github/workflows` therefore runs on both forges, and creating a `.gitea/`
# directory later would silently switch Gitea to it and skip everything here.
#
# What CI buys and what it does not: local hooks can be skipped with --no-verify or simply
# never installed in a fresh clone, and CI cannot be. But on Gitea, a direct push to `main`
# is only gated by force-push and signed-commit rules - status checks apply when a PULL
# REQUEST merges. So for a solo pusher this DETECTS a problem after the push; it does not
# prevent it. Treat a red run as something to fix, not as a gate that held.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read        # least privilege; Scorecard's Token-Permissions check

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # betterleaks and the identity check need history, not a shallow tip
          # On a pull request the default checkout is GitHub's synthetic test merge
          # (refs/pull/N/merge), committed by `GitHub <noreply@github.com>`. The identity
          # check then fails on a commit that never lands (PR #44, 5 Oct 2026: 21 checked,
          # 1 wrong). Check out the PR's own head, the commits that would reach main.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run every hook against every file
        env:
          # house-identity checks the identity CONFIGURED on the machine making a commit.
          # A runner makes none: unconfigured, the hook refuses (run 1 of this workflow,
          # 5 Oct 2026); configured to match, it compares the runner with itself and can
          # never fail. The pushed history is checked in the next step instead.
          SKIP: house-identity
        run: |
          python -m pip install --upgrade pre-commit
          pre-commit run --all-files --show-diff-on-failure
      - name: Every commit carries the expected identity
        run: |
          bash scripts/check-history-identity.sh \
            "Alon A. Rabinowitz" "45129051+AlonRR@users.noreply.github.com"
      - name: Hook and history-check tests
        run: |
          bash tests/test-hooks.sh
          bash tests/test-history-identity.sh

  secrets-history:
    # The pre-commit secret hook only sees staged content. This is the history gate, and it is
    # the one that matters before a repo goes public.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}   # as in pre-commit above
      - name: Scan full history for secrets
        # Pinned to the version .pre-commit-config.yaml uses. The archive name carries
        # the version (betterleaks' .goreleaser.yml: <project>_<version>_<os>_<arch>),
        # so the kit's unversioned `latest/download/betterleaks_linux_x64.tar.gz` was a
        # 404. Without -f, curl saved that 404 page and tar failed on it ("not in gzip
        # format", run 1, 5 Oct 2026). -f makes a missing asset fail at the download.
        env:
          BL_VERSION: "1.8.1"
        run: |
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BL_VERSION}"
          archive="betterleaks_${BL_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar xzf "${archive}" betterleaks
          ./betterleaks git --no-banner --redact --exit-code 1 .
