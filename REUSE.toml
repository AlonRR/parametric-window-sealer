[[annotations]]
path = [
  ".githooks/**",
  ".github/**",
  "scripts/**",
  "tests/**",
  ".editorconfig",
  ".gitattributes",
  ".gitignore",
  ".pre-commit-config.yaml",
  ".repo-status",
  "PROJECT.yml",
  "REUSE.toml",
]
SPDX-FileCopyrightText = "2026 Alon A. Rabinowitz"
SPDX-License-Identifier = "MPL-2.0"
