# Licensing per the REUSE specification (https://reuse.software). Check with `reuse lint`.
#
# The split, chosen by the owner on 5 Oct 2026 (Q1) and settled for the design by Q36:
#   CERN-OHL-S-2.0  the documentation, and any design file that is not code
#   MPL-2.0         code: the page, including the code that defines the pieces' shapes (Q36),
#                   and scripts, hooks, tests, CI and tool configuration
# Files the tool generates are not part of this repository; they are the user's to do with
# as they wish (Q36), as the README and the page say.
#
# When several annotations match a file, the LAST matching one wins, so the general
# rule comes first and the narrower code rule after it.
version = 1

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Alon A. Rabinowitz"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

[[annotations]]
path = [
  ".claude/**",
  ".githooks/**",
  ".github/**",
  "scripts/**",
  "spikes/**",
  "tests/**",
  "web/**",
  ".editorconfig",
  ".gitattributes",
  ".gitignore",
  ".markdownlint-cli2.yaml",
  ".pre-commit-config.yaml",
  ".repo-status",
  ".yamllint.yaml",
  "PROJECT.yml",
  "REUSE.toml",
]
SPDX-FileCopyrightText = "2026 Alon A. Rabinowitz"
SPDX-License-Identifier = "MPL-2.0"

# Documentation inside the code folders stays under the documentation licence.
[[annotations]]
path = "spikes/**/README.md"
SPDX-FileCopyrightText = "2026 Alon A. Rabinowitz"
SPDX-License-Identifier = "CERN-OHL-S-2.0"
